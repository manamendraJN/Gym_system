{# Saved branding + theme. All values are validated in apps/core/appearance.py before they get here. #}
{% if APPEARANCE.obj.favicon %}<link rel="icon" href="{{ APPEARANCE.obj.favicon.url }}">{% endif %}
<style id="appearance-vars">{{ APPEARANCE.css|safe }}</style>
<script>(function(){var m="{{ APPEARANCE.mode }}",d=m==="dark"||(m==="system"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-bs-theme",d?"dark":"light");})();</script>
